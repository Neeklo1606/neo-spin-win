server {
    listen 80;
    listen [::]:80;
    server_name azotrostovskiy.ru www.azotrostovskiy.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://azotrostovskiy.ru$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.azotrostovskiy.ru;
    ssl_certificate     /etc/letsencrypt/live/azotrostovskiy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azotrostovskiy.ru/privkey.pem;
    return 301 https://azotrostovskiy.ru$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name azotrostovskiy.ru;
    ssl_certificate     /etc/letsencrypt/live/azotrostovskiy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azotrostovskiy.ru/privkey.pem;
    include snippets/security-headers.conf;
    root /var/www/azotrostovskiy.ru/dist;
    index index.html;
    client_max_body_size 32M;

    # Compression for text assets (global nginx.conf only compresses text/html)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml font/ttf;

    # Hashed build files: cache for a year
    location ^~ /assets/ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary Accept always;
        try_files $uri$webp_suffix $uri =404;
    }

    # Images in the site root (names are stable, CMS points to them): cache 7 days, prefer WebP
    location ~* \.(?:png|jpe?g)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Vary Accept always;
        try_files $uri$webp_suffix $uri =404;
    }

    location ~* \.(?:ico|svg|webp|webmanifest|woff2?)$ {
        include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Any other missing file with an extension → real 404 (not index.html with 200)
    location ~* "\.[a-z0-9]{2,5}$" {
        try_files $uri =404;
    }

    # index.html must never be cached, so new builds show up immediately
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/auth {
        rewrite ^/api/auth(.*) /auth$1 break;
        proxy_pass http://127.0.0.1:3000;
        include snippets/proxy.conf;
    }
    location ^~ /api {
        proxy_pass http://127.0.0.1:3000;
        include snippets/proxy.conf;
    }
    location ^~ /auth {
        proxy_pass http://127.0.0.1:3000;
        include snippets/proxy.conf;
    }
}
